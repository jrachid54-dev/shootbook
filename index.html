<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShootBook">
<meta name="theme-color" content="#0e1013">
<title>ShootBook</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0e1013;--card:#1b1e25;--card2:#262a33;--tx:#f3f4f6;--mu:#8b909a;--bd:#2a2e37;--ac:#17b3a3;--warn:#f59e0b;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:-apple-system,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding:calc(env(safe-area-inset-top) + 16px) 0 calc(120px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
body.wait>*{visibility:hidden}
#login{display:none;padding:0 20px}
body.out #login{display:block}
body.out main,body.out nav,body.out .fab{display:none!important}
main{padding:0 18px}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px}
.hero{background:#17262a;border:1px solid #24383c;border-radius:22px;padding:20px;margin-bottom:18px}
.badge{display:inline-flex;align-items:center;gap:8px;background:#12312e;color:#5eead4;border-radius:20px;padding:6px 14px;font-size:15px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ac);display:inline-block}
.rd{width:9px;height:9px;border-radius:50%;background:#ef4444;display:inline-block;margin-right:10px;vertical-align:1px}
.chip{background:var(--card2);color:var(--tx);border-radius:20px;padding:6px 14px;font-size:14px;font-weight:600;display:inline-block;white-space:nowrap}
.ht{font-size:28px;font-weight:700;margin:14px 0 6px}
.hl{color:#cbd5e1;margin:0;font-size:17px}
.hr{height:1px;background:#2f4448;margin:16px 0}
.lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 2px}
.hv{font-size:19px;font-weight:700;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mcs{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin-bottom:18px}
.mc{background:var(--card);color:var(--mu);border:0;border-radius:24px;padding:13px 6px;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc.on{background:var(--ac);color:#fff}
.big{font-size:32px;font-weight:700;margin:0}
.bar{height:7px;background:var(--card2);border-radius:6px;margin:18px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stc{background:var(--card);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:stretch}
.stc>i{width:4px;border-radius:3px;flex:0 0 4px}
.sn{font-size:30px;font-weight:700;margin:0}
.ml{color:var(--mu);margin:0;font-size:13px}
.sec{color:var(--mu);font-size:15px;margin:22px 0 10px}
.mh{color:var(--mu);font-size:20px;font-weight:600;margin:24px 0 12px}
.pt{font-size:30px;font-weight:700;margin:4px 0 16px}
.mt{font-size:19px;font-weight:600;margin:0}
.sc2{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:0 16px 14px;margin-bottom:12px}
.sc2 .top{border-bottom:1px solid var(--bd);padding:14px 0 12px;margin-bottom:12px;font-weight:600;font-size:16px}
.cn{font-size:18px;font-weight:600;margin:0 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{font-size:17px;font-weight:600;white-space:nowrap;margin:0}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fsel{flex:0 0 150px;margin:0;background:var(--card);border:0;height:50px;border-radius:14px;font-weight:600}
.ib{background:var(--card);border:0;color:var(--tx);border-radius:14px;width:50px;height:50px;display:flex;align-items:center;justify-content:center;font-size:24px}
.ib svg,.seg svg{width:22px;height:22px}
.seg{margin-left:auto;background:var(--card);border-radius:26px;padding:4px;display:flex}
.seg button{background:none;border:0;color:var(--mu);width:44px;height:42px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.seg button.on{background:#0b0c0f;color:var(--tx)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;background:#15171c;border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;color:var(--mu);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:500}
nav svg{width:26px;height:26px}
nav button.on{color:var(--ac)}
.fab{position:fixed;right:max(20px,calc(50% - 300px));bottom:calc(90px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:36px;line-height:1;box-shadow:0 6px 20px #17b3a355;z-index:6}
.btn{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:14px;font-size:16px;width:100%;font-weight:600}
.ghost{display:block;text-align:center;background:var(--card2);border:0;color:var(--tx);border-radius:14px;padding:12px;font-size:15px;width:100%;text-decoration:none;font-weight:500}
.lnk{background:none;border:0;color:var(--ac);font-size:17px;padding:6px 0}
input,select,textarea{width:100%;font-size:16px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card2);color:var(--tx);font-family:inherit;margin-bottom:10px}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:4px}
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:10;padding:calc(env(safe-area-inset-top) + 12px) 18px 40px;display:none}
.sheet.open{display:block}
.sheet>div{max-width:640px;margin:0 auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal div{padding:10px 0;border-radius:10px;font-size:15px;position:relative}
.cal .d{background:var(--card2)}
.cal .has::after{content:'';position:absolute;bottom:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ac)}
.cal .today{outline:2px solid var(--ac)}
.cal .sel{background:var(--ac);color:#fff}
.mood{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.mood img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.chk{display:flex;align-items:center;gap:12px;padding:8px 0;margin:0;font-size:16px;color:var(--tx)}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--ac)}
.warn{background:#f59e0b22;color:var(--warn);padding:10px 12px;border-radius:12px;font-size:14px;margin-bottom:10px}
.av{width:120px;height:120px;border-radius:50%;background:var(--card2);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.av svg{width:56px;height:56px}
.mi{background:var(--card);border-radius:20px;padding:16px;display:flex;align-items:center;gap:16px;margin-bottom:14px}
.mic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:0 0 52px}
.mic svg{width:26px;height:26px}
.mi>svg{width:22px;height:22px;color:var(--mu)}
.out{background:var(--card);color:var(--bad);border:0;border-radius:24px;width:100%;padding:16px;font-size:19px;font-weight:600;margin-top:8px}
.cb{width:50px;height:50px;border-radius:50%;background:var(--card);border:0;color:var(--tx);display:flex;align-items:center;justify-content:center;flex:0 0 50px}
.cb2{background:none;border:0;color:var(--mu);width:42px;height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:center}
.cb svg,.cb2 svg{width:24px;height:24px}
.dn{flex:1;font-size:30px;font-weight:800;margin:0 0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-radius:18px;padding:6px;gap:4px;margin-bottom:14px}
.dt button{background:none;border:0;color:var(--mu);border-radius:14px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.dt button svg{width:22px;height:22px}
.dt button.on{background:#12312e;color:var(--ac)}
.db{width:76px;height:84px;border-radius:16px;background:#12312e;color:var(--ac);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 76px}
.db span{font-size:14px;font-weight:600;letter-spacing:.08em}
.db b{font-size:34px;line-height:1.1}
.dw{font-size:22px;font-weight:700;margin:0 0 4px}
.si{display:inline-flex;width:18px;height:18px;vertical-align:-3px;margin-right:6px}
.loc{display:flex;align-items:center;gap:12px;min-width:0;flex:1;color:var(--tx);text-decoration:none}
.loc .ic{width:42px;height:42px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:0 0 42px;color:var(--mu)}
.loc svg{width:20px;height:20px}
.lt{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf{display:flex;align-items:center}
.wf button{width:56px;height:56px;border-radius:50%;border:2px solid var(--bd);background:none;color:var(--mu);flex:0 0 56px;display:flex;align-items:center;justify-content:center}
.wf button svg{width:24px;height:24px}
.wf button.on{color:#fff}
.wf i{flex:1;height:3px;background:var(--bd)}
.wf i.on{background:var(--ac)}
.wfl{display:flex;justify-content:space-between;margin:10px -8px 18px}
.wfl span{width:72px;text-align:center;font-size:13px;color:var(--mu)}
.cs{background:#12302b;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pdf{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border:1.5px solid #3b82f6;background:none;color:#60a5fa;border-radius:18px;font-size:18px;font-weight:600}
.pdf svg{width:22px;height:22px}
#print{display:none}
@media print{html,body{background:#fff!important;padding:0!important}body>*{display:none!important}#print{display:block!important;color:#000;font-family:sans-serif;padding:24px}}
</style>
</head>
<body class="wait">
<div id="login">
<h1 style="margin:60px 0 6px;font-size:36px;color:var(--ac)">ShootBook</h1>
<p class="ml" style="font-size:16px;margin-bottom:28px">Sign in to keep your shoots saved on every device.</p>
<div class="card">
<input id="l_email" type="email" placeholder="you@gmail.com" autocomplete="email">
<input id="l_pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
<p id="l_err" style="color:var(--bad);font-size:14px;margin:0 0 10px"></p>
<button class="btn" onclick="login()">Sign in</button>
<div style="height:10px"></div>
<button class="ghost" onclick="signup()">Create account</button>
<button class="lnk" style="width:100%;margin-top:10px" onclick="resetPw()">Forgot password?</button>
</div>
</div>
<main id="view"></main>
<button class="fab" id="fab" onclick="openShoot()">+</button>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div id="sin"></div></div>
<div id="print"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAbeKrVdf2W4T6UpbdF4WXYuIr-1bcFhkc",
  authDomain: "shootbook-9f104.firebaseapp.com",
  projectId: "shootbook-9f104",
  storageBucket: "shootbook-9f104.firebasestorage.app",
  messagingSenderId: "141778281558",
  appId: "1:141778281558:web:a8ee9735b01d60156387f7"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={
grid:svg('<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>'),
cal:svg('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
ads:svg('<path d="M3 10v4h4l6 4V6L7 10H3zM17 9a4 4 0 0 1 0 6"/>'),
user:svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
search:svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
list:svg('<path d="M4 6h16M4 12h16M4 18h16"/>'),
chev:svg('<path d="M9 6l6 6-6 6"/>'),
back:svg('<path d="M15 6l-6 6 6 6"/>'),
chart:svg('<path d="M6 20V12M12 20V6M18 20v-9"/>'),
bag:svg('<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'),
img:svg('<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 16l-5-5-9 9"/>'),
gear:svg('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'),
dl:svg('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
pen:svg('<path d="M4 20h4L19 9l-4-4L4 16v4z"/>'),
trash:svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
trend:svg('<path d="M3 17l6-6 4 4 8-8"/>'),
dollar:svg('<path d="M12 3v18M16 7.5c0-1.9-1.8-3-4-3s-4 1.1-4 3 1.8 2.6 4 3 4 1.1 4 3-1.8 3-4 3-4-1.1-4-3"/>'),
wrench:svg('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>'),
pin:svg('<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'),
clock:svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
check:svg('<path d="M5 12l5 5 9-10"/>'),
send:svg('<path d="M4 12l16-8-6 16-3-7-7-1z"/>'),
file:svg('<path d="M14 3H6v18h12V7l-4-4z"/><path d="M14 3v4h4"/>')};
const TABS=[['dash','Dashboard',IC.grid],['shoots','Photoshoots',IC.cal],['ads','Ads',IC.ads],['profile','Profile',IC.user]];
const ST=['Pending','Confirmed','Editing','Delivered'];
const STC={Pending:'#f59e0b',Confirmed:'#22c55e',Editing:'#3b82f6',Delivered:'#6b7280'};
const TYPES=['Wedding','Engagement','Kateb kitab','Portrait','Family','Event','Commercial','Product','Other'];
const K='shootbook_v1';
const EMPTY=()=>({shoots:[],ads:[],gear:['Camera body','Lenses','Charged batteries','Memory cards','Flash','Reflector'],name:''});
let D=EMPTY(),user=null,unsub=null;
let tab='dash',dm=0,filt='All',q='',showQ=false,view='list',calM=new Date(),selDay=null,jump=false;
let cur=null,isNew=false,dId=null,dtab='status',dMood=null;
const g=id=>document.getElementById(id);
const sh=g('sheet'),sin=g('sin');
const userRef=()=>db.collection('users').doc(user.uid);
const moodRef=id=>userRef().collection('mood').doc(String(id));
function save(){if(!user)return;userRef().set({shoots:D.shoots,ads:D.ads,gear:D.gear,name:D.name||''}).catch(e=>alert('Not saved: '+e.message))}
const $=n=>'$'+Math.round(+n||0).toLocaleString('en-US');
const $$=n=>'$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=d=>d?new Date(d+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'';
const tr=s=>s.time?s.time+(s.end?'–'+s.end:''):'';
const srcName=id=>id==0?'Referral':id==-1?'Organic social':((D.ads.find(a=>a.id==id)||{}).name||'Ad');
const sum=(arr,f)=>arr.reduce((t,x)=>t+(+f(x)||0),0);
const byDate=(a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''));
const stOf=s=>s.status||'Confirmed';
const info=(k,v)=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--bd)"><span class="ml" style="font-size:15px">${k}</span><span style="font-size:15px;text-align:right">${v}</span></div>`;
function monthKey(o){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);return[iso(d).slice(0,7),d.toLocaleDateString('en-GB',{month:'long'})]}

g('nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[2]}${t[1]}</button>`).join('');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab=='shoots')jump=true;render();scrollTo(0,0)});

auth.onAuthStateChanged(u=>{
document.body.classList.remove('wait');
if(unsub){unsub();unsub=null}
user=u;
if(!u){document.body.classList.add('out');D=EMPTY();closeSheet();return}
document.body.classList.remove('out');
unsub=userRef().onSnapshot(snap=>{
if(!snap.exists){migrate();return}
D=Object.assign(EMPTY(),snap.data());render()},
e=>alert('Could not load your data: '+e.message))});

async function migrate(){let old=null;try{old=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
const d=old||EMPTY();
for(const s of d.shoots||[]){if(s.mood&&s.mood.length){s.moodN=s.mood.length;try{await moodRef(s.id).set({imgs:s.mood})}catch(e){}}delete s.mood}
await userRef().set({shoots:d.shoots||[],ads:d.ads||[],gear:d.gear||EMPTY().gear,name:''});
localStorage.removeItem(K)}

const lv=()=>[g('l_email').value.trim(),g('l_pass').value];
function lerr(e){const m={'auth/invalid-credential':'Wrong email or password.','auth/invalid-login-credentials':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'No account with this email. Tap Create account.','auth/email-already-in-use':'This email already has an account. Tap Sign in.','auth/weak-password':'Password needs at least 6 characters.','auth/invalid-email':'Enter a valid email.','auth/network-request-failed':'No internet connection.'};g('l_err').textContent=m[e.code]||e.message}
function login(){const[e,p]=lv();if(!e||!p){g('l_err').textContent='Enter your email and password.';return}g('l_err').textContent='';auth.signInWithEmailAndPassword(e,p).catch(lerr)}
function signup(){const[e,p]=lv();if(!e||!p){g('l_err').textContent='Enter your email and a password.';return}g('l_err').textContent='';auth.createUserWithEmailAndPassword(e,p).catch(lerr)}
function resetPw(){const e=g('l_email').value.trim();if(!e){g('l_err').textContent='Enter your email first.';return}auth.sendPasswordResetEmail(e).then(()=>alert('Check your email for a reset link.')).catch(lerr)}

function shootCard(s){const st=stOf(s),owed=(+s.price||0)-(+s.paid||0);
return `<div class="sc2" onclick="openDetail(${s.id})"><div class="row top"><span>${fmtDate(s.date)}${s.time?' <span style="color:var(--mu)">·</span> '+tr(s):''}</span><span style="color:${STC[st]};font-size:14px;font-weight:500">${st}</span></div><div class="row"><div style="min-width:0"><p class="cn">${esc(s.client)}</p><p class="ml" style="font-size:15px">${esc(s.loc||s.type)}</p></div><p class="pr">${owed>0?'<i class="rd"></i>':''}${$$(s.price)}</p></div></div>`}

function vDash(){
const now=new Date(),t=iso(now),hm=now.toTimeString().slice(0,5);
const up=D.shoots.filter(s=>s.date>t||(s.date==t&&(s.end||s.time||'23:59')>=hm)).sort(byDate)[0];
let h;
if(!up)h=`<div class="hero"><span class="badge"><i class="dot"></i>Up next</span><p class="ht">No upcoming shoots</p><p class="hl">Tap + to add your next booking.</p></div>`;
else{const days=Math.round((new Date(up.date+'T00:00')-new Date(t+'T00:00'))/864e5);
const when=days==0?'Today':days==1?'Tomorrow':'In '+days+' days';

function calHTML(arr){const y=calM.getFullYear(),mo=calM.getMonth(),first=new Date(y,mo,1),days=new Date(y,mo+1,0).getDate(),off=(first.getDay()+6)%7,t=iso(new Date());

for(let d=1;d<=days;d++){const ds=iso(new Date(y,mo,d)),n=arr.some(s=>s.date==ds);h+=`<div class="d${n?' has':''}${ds==t?' today':''}${ds==selDay?' sel':''}" onclick="selDay=selDay=='${ds}'?null:'${ds}';drawList()">${d}</div>`}

function drawDetail(){const s=D.shoots.find(x=>x.id==dId);if(!s){closeSheet();return}
const st=stOf(s),due=(+s.price||0)-(+s.paid||0),dt=new Date(s.date+'T00:00');
const tabs=[['status','Status',IC.trend],['notes','Notes',IC.pen],['pay','Pay',IC.dollar],['gear','Gear',IC.wrench],['mood','Mood',IC.img]];

<div class="dt">${tabs.map(t=>`<button class="${dtab==t[0]?'on':''}" onclick="dtab='${t[0]}';drawDetail()">${t[2]}<span>${t[1]}</span></button>`).join('')}</div>
<div class="card" style="border-bottom:3px solid ${STC[st]}"><div class="row" style="justify-content:flex-start;gap:16px"><div class="db"><span>${dt.toLocaleDateString('en-GB',{month:'short'}).toUpperCase()}</span><b>${dt.getDate()}</b></div><div><p class="dw">${dt.toLocaleDateString('en-GB',{weekday:'long'})}</p><p class="ml" style="font-size:17px"><span class="si">${IC.clock}</span>${s.time?tr(s).replace('–',' – '):'No time set'}</p></div></div><div class="hr" style="background:var(--bd)"></div><div class="row"><a class="loc"${s.loc?` href="https://maps.google.com/?q=${encodeURIComponent(s.loc)}"`:''}><span class="ic">${IC.pin}</span><span class="lt">${esc(s.loc||'No location')}</span></a><div style="text-align:right"><p class="pr" style="font-size:22px">${$$(s.price)}</p><p style="margin:0;font-size:15px;color:${due>0?'#ef4444':'#5eead4'}">${due>0?$$(due)+' due':'Paid in full'}</p></div></div></div>
<div id="dtc"></div>`;
({status:dStatus,notes:dNotes,pay:dPay,gear:dGear,mood:dMoodTab})[dtab](s)}

const wa=(s.phone||'').replace(/\D/g,''),ig=(s.insta||'').replace('@','').trim();

<div class="wf">${ST.map((x,j)=>`${j?`<i class="${j<=i?'on':''}"></i>`:''}<button onclick="setStatus('${x}')" class="${j<=i?'on':''}" style="${j<=i?`background:${STC[x]};border-color:${STC[x]}`:''}" aria-label="${x}">${ic[j]}</button>`).join('')}</div>
<div class="wfl">${ST.map((x,j)=>`<span style="${j==i?'color:var(--tx);font-weight:600':''}">${x}</span>`).join('')}</div>
<div class="cs"><div><p class="lab">Current stage</p><p style="margin:0;font-size:19px;font-weight:700;color:${STC[ST[i]]}">${ST[i]}</p></div>${nx?`<button class="ghost" style="width:auto;padding:12px 16px;background:#0b0c0f" onclick="setStatus('${nx}')">Mark as ${nx}</button>`:''}</div></div>
<div class="card"><p class="lab" style="margin-bottom:4px">Client</p>${info('Type',esc(s.type))}${info('Source',esc(srcName(s.src)))}${s.phone?info('Phone',`<a href="tel:${esc(s.phone)}" style="color:var(--ac)">${esc(s.phone)}</a>`):''}${ig?info('Instagram',`<a href="https://instagram.com/${encodeURIComponent(ig)}" style="color:var(--ac)">@${esc(ig)}</a>`):''}${wa?`<a class="ghost" style="margin-top:14px" href="https://wa.me/${wa}">Message on WhatsApp</a>`:''}</div>
<button class="pdf" onclick="printBrief()">${IC.file}Export PDF</button>`}

function dNotes(s){g('dtc').innerHTML=`<div class="card"><p class="lab" style="margin-bottom:10px">Notes</p><textarea id="dnt" rows="8" placeholder="Client preferences, lighting ideas, shot list">${esc(s.notes)}</textarea><button class="btn" onclick="const v=g('dnt').value;updateShoot(dId,s=>{s.notes=v});alert('Saved')">Save notes</button></div>`}

function dPay(s){const due=(+s.price||0)-(+s.paid||0),pct=+s.price?Math.min(100,(+s.paid||0)/s.price*100):0;
g('dtc').innerHTML=`<div class="card"><div class="row"><div><p class="lab">Paid</p><p class="big" style="font-size:26px;color:#5eead4">${$$(s.paid)}</p></div><div style="text-align:right"><p class="lab">Due</p><p class="big" style="font-size:26px;color:${due>0?'#ef4444':'var(--mu)'}">${$$(Math.max(due,0))}</p></div></div><div class="bar"><i style="width:${pct}%"></i></div><p class="ml" style="font-size:14px">Total ${$$(s.price)}</p></div>
<div class="card"><label>Add a payment ($)</label><div class="row"><input id="pa" type="number" inputmode="decimal" placeholder="50" style="margin:0"><button class="btn" style="width:auto;padding:12px 20px" onclick="addPay()">Add</button></div>${due>0?`<button class="ghost" style="margin-top:12px" onclick="addPay(${due})">Mark fully paid</button>`:''}</div>
${(s.pays||[]).length?`<p class="sec">Payment history</p><div class="card">${s.pays.slice().reverse().map(p=>info(fmtDate(p.d),$$(p.a))).join('')}</div>`:''}`}
function addPay(v){const a=v||+g('pa').value;if(!a){alert('Enter an amount.');return}updateShoot(dId,s=>{s.paid=(+s.paid||0)+a;s.pays=(s.pays||[]).concat({a,d:iso(new Date())})})}

function dGear(s){const gr=s.gear||[],n=gr.filter(x=>x.ok).length;
g('dtc').innerHTML=`<div class="card"><div class="row" style="margin-bottom:6px"><p class="mt">Packing list</p><span class="chip">${n}/${gr.length} packed</span></div>${gr.map((x,i)=>`<label class="chk"><input type="checkbox"${x.ok?' checked':''} onchange="const c=this.checked;updateShoot(dId,s=>{s.gear[${i}].ok=c})"><span>${esc(x.n)}</span></label>`).join('')}<div class="row" style="margin-top:10px"><input id="dg" placeholder="Add item" style="margin:0"><button class="ghost" style="width:auto;padding:12px 16px" onclick="const v=g('dg').value.trim();if(v)updateShoot(dId,s=>{s.gear=(s.gear||[]).concat({n:v,ok:false})})">Add</button></div></div>`}

function dMoodTab(s){if(dMood===null){g('dtc').innerHTML='<div class="card ml" style="font-size:15px">Loading photos…</div>';const id=s.id;
moodRef(id).get().then(d=>{if(dId==id){dMood=d.exists?(d.data().imgs||[]):[];if(dtab=='mood')drawDetail()}}).catch(()=>{dMood=[];if(dId==id)drawDetail()});return}
g('dtc').innerHTML=`<div class="card">${dMood.length?`<div class="mood">${dMood.map((m,i)=>`<img src="${m}" onclick="if(confirm('Remove this photo?')){dMood.splice(${i},1);saveMood()}">`).join('')}</div>`:'<p class="ml" style="font-size:15px;margin-bottom:12px">No reference photos yet.</p>'}<label class="ghost" style="margin:0;color:var(--tx);font-size:15px">Add photos<input type="file" accept="image/*" multiple style="display:none" onchange="addDMood(this.files)"></label></div>`}
function saveMood(){let cut=false;while(dMood.length&&JSON.stringify(dMood).length>950000){dMood.pop();cut=true}if(cut)alert('Too many photos for one shoot. Some were not added.');
const id=dId;(dMood.length?moodRef(id).set({imgs:dMood}):moodRef(id).delete()).catch(()=>{});updateShoot(id,s=>{s.moodN=dMood.length})}
function addDMood(files){let left=files.length;if(!left)return;[...files].forEach(f=>compress(f,u=>{dMood.push(u);if(--left==0)saveMood()}))}
function compress(f,cb){const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const s=Math.min(1,500/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};img.src=e.target.result};r.readAsDataURL(f)}

function printBrief(){const s=D.shoots.find(x=>x.id==dId);if(!s)return;const due=(+s.price||0)-(+s.paid||0);
g('print').innerHTML=`<h1 style="margin:0 0 6px">${esc(s.client)}</h1><p>${fmtDate(s.date)} ${tr(s)}${s.loc?' · '+esc(s.loc):''}</p><p>Type: ${esc(s.type)} · Status: ${stOf(s)}</p><p>Price: ${$$(s.price)} · Paid: ${$$(s.paid)} · Due: ${$$(Math.max(due,0))}</p>${s.phone?`<p>Phone: ${esc(s.phone)}</p>`:''}${s.insta?`<p>Instagram: ${esc(s.insta)}</p>`:''}${s.notes?`<h3>Notes</h3><p style="white-space:pre-wrap">${esc(s.notes)}</p>`:''}${(s.gear||[]).length?`<h3>Gear</h3><ul>${s.gear.map(x=>`<li>${x.ok?'☑':'☐'} ${esc(x.n)}</li>`).join('')}</ul>`:''}`;
window.print()}

function openShoot(id){
const s=D.shoots.find(x=>x.id==id);isNew=!s;
cur=s?JSON.parse(JSON.stringify(s)):{id:Date.now(),client:'',phone:'',insta:'',type:'Portrait',status:'Confirmed',date:selDay||iso(new Date()),time:'',end:'',loc:'',price:'',paid:'',src:0,notes:'',gear:D.gear.map(n=>({n,ok:false})),pays:[],moodN:0};
const opts=[[0,'Referral / word of mouth'],[-1,'Organic social (no ad)'],...D.ads.map(a=>[a.id,a.name+' ('+a.plat+' ad)'])];
sin.innerHTML=`<div class="row" style="margin-bottom:14px"><button class="lnk" onclick="${isNew?'closeSheet()':'openDetail('+cur.id+')'}">Cancel</button><b style="font-size:17px">${isNew?'New shoot':'Edit shoot'}</b><button class="lnk" onclick="saveShoot()"><b>Save</b></button></div>
<div class="card"><label>Client name</label><input id="f_client" value="${esc(cur.client)}" placeholder="Maya and Karim">
<label>Phone</label><input id="f_phone" type="tel" value="${esc(cur.phone)}" placeholder="+961 70 123 456">
<label>Instagram</label><input id="f_insta" value="${esc(cur.insta)}" placeholder="@username" style="margin:0"></div>
<div class="card"><label>Status</label><select id="f_status">${ST.map(t=>`<option${t==stOf(cur)?' selected':''}>${t}</option>`).join('')}</select>
<label>Type</label><select id="f_type">${TYPES.map(t=>`<option${t==cur.type?' selected':''}>${t}</option>`).join('')}</select>
<label>Date</label><input id="f_date" type="date" value="${cur.date}" onchange="overlap()">
<div class="row"><div style="flex:1"><label>Start</label><input id="f_time" type="time" value="${cur.time||''}"></div><div style="flex:1"><label>End</label><input id="f_end" type="time" value="${cur.end||''}"></div></div>
<div id="ov"></div>
<label>Location</label><input id="f_loc" value="${esc(cur.loc)}" placeholder="Batroun" style="margin:0"></div>
<div class="card"><label>Price ($)</label><input id="f_price" type="number" inputmode="decimal" value="${cur.price}">
<label>Paid so far ($)</label><input id="f_paid" type="number" inputmode="decimal" value="${cur.paid}">
<label style="margin-top:6px">Where did this client come from?</label><select id="f_src" style="margin:0">${opts.map(o=>`<option value="${o[0]}"${o[0]==cur.src?' selected':''}>${esc(o[1])}</option>`).join('')}</select></div>
<div class="card"><label>Notes</label><textarea id="f_notes" rows="4" placeholder="Client preferences, lighting ideas, shot list" style="margin:0">${esc(cur.notes)}</textarea></div>
${isNew?'':'<button class="out" onclick="delShoot()">Delete shoot</button>'}`;
overlap();openSheet()}
function overlap(){const d=g('f_date').value,o=D.shoots.filter(s=>s.date==d&&s.id!=cur.id);g('ov').innerHTML=o.length?`<div class="warn">You already have ${o.map(s=>esc(s.client)+(s.time?' at '+s.time:'')).join(', ')} on this day.</div>`:''}
function saveShoot(){const c=g('f_client').value.trim(),d=g('f_date').value;if(!c||!d){alert('Add a client name and a date.');return}
Object.assign(cur,{client:c,phone:g('f_phone').value.trim(),insta:g('f_insta').value.trim(),status:g('f_status').value,type:g('f_type').value,date:d,time:g('f_time').value,end:g('f_end').value,loc:g('f_loc').value.trim(),price:+g('f_price').value||0,paid:+g('f_paid').value||0,src:+g('f_src').value,notes:g('f_notes').value});
const i=D.shoots.findIndex(x=>x.id==cur.id);if(i>=0)D.shoots[i]=cur;else D.shoots.push(cur);
save();render();dId=null;openDetail(cur.id)}
function delShoot(){if(confirm('Delete this shoot?')){D.shoots=D.shoots.filter(s=>s.id!=cur.id);moodRef(cur.id).delete().catch(()=>{});save();closeSheet();render()}}

function openAd(id){const a=D.ads.find(x=>x.id==id);isNew=!a;cur=a?{...a}:{id:Date.now(),name:'',plat:'Instagram',spent:'',date:iso(new Date())};
const s=D.shoots.filter(x=>x.src==cur.id);
sin.innerHTML=`<div class="row" style="margin-bottom:14px"><button class="lnk" onclick="closeSheet()">Cancel</button><b style="font-size:17px">${isNew?'New ad':'Ad campaign'}</b><button class="lnk" onclick="saveAd()"><b>Save</b></button></div>
<div class="card"><label>Campaign name</label><input id="a_name" value="${esc(cur.name)}" placeholder="Wedding season promo">
<label>Platform</label><select id="a_plat">${['Instagram','Facebook','TikTok','Google','Other'].map(p=>`<option${p==cur.plat?' selected':''}>${p}</option>`).join('')}</select>
<label>Start date</label><input id="a_date" type="date" value="${cur.date}">
<label>Total spent ($)</label><input id="a_spent" type="number" inputmode="decimal" value="${cur.spent}" style="margin:0"></div>
${s.length?'<p class="sec">Clients from this ad</p>'+s.map(shootCard).join(''):''}
${isNew?'':'<button class="out" onclick="delAd()">Delete campaign</button>'}`;openSheet()}
function saveAd(){const n=g('a_name').value.trim();if(!n){alert('Add a campaign name.');return}
Object.assign(cur,{name:n,plat:g('a_plat').value,date:g('a_date').value,spent:+g('a_spent').value||0});
const i=D.ads.findIndex(a=>a.id==cur.id);if(i>=0)D.ads[i]=cur;else D.ads.push(cur);save();closeSheet();render()}
function delAd(){if(confirm('Delete this campaign? Its clients will be moved to Referral.')){D.shoots.forEach(s=>{if(s.src==cur.id)s.src=0});D.ads=D.ads.filter(a=>a.id!=cur.id);save();closeSheet();render()}}

async function shareFile(txt,name,type){const file=new File([txt],name,{type});
if(/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]})}catch(e){}return}
const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click()}
function exportCSV(){const cols=['Date','Start','End','Client','Phone','Instagram','Type','Status','Location','Price','Paid','Owed','Source','Notes'];
const rows=[...D.shoots].sort(byDate).map(s=>[s.date,s.time,s.end,s.client,s.phone,s.insta,s.type,stOf(s),s.loc,s.price,s.paid,(+s.price||0)-(+s.paid||0),srcName(s.src),s.notes]);
const csv=[cols,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
shareFile('\ufeff'+csv,'shootbook-'+iso(new Date())+'.csv','text/csv')}
function exportData(){shareFile(JSON.stringify(D),'shootbook-backup-'+iso(new Date())+'.json','application/json')}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.shoots||!x.ads)throw 0;if(confirm('Replace all current data with this backup?')){x.shoots.forEach(s=>delete s.mood);D=Object.assign(EMPTY(),x);save();closeSheet();render()}}catch(e){alert('That file is not a valid backup.')}};r.readAsText(f)}

function render(){if(!user)return;
g('view').innerHTML={dash:vDash,shoots:vShoots,ads:vAds,profile:vProfile}[tab]();
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
g('fab').style.display=(tab=='dash'||tab=='shoots')?'':'none';
if(tab=='shoots')drawList()}
</script>
